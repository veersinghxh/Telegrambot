
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jannvi AI Girlfriend ❤️</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <div class="header">

        <div class="avatar">
    <img src="dp.png" alt="Jannvi">
</div>

        <div>
            <h3>Rashmika Mandanna ❤❤❤❤ #❤️</h3>
            <div class="status" id="status">
                ● Girlfriend Online
            </div>
        </div>

    </div>

    <div id="chat">

        <div class="message bot">
            Hey baby! 💗 Finally you're here.
            How was your day? I missed chatting with you! 🥰
        </div>

    </div>

    <div id="typing" class="typing" hidden>
        Rashmika Mandanna is typing... 💕
    </div>

    <div class="input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Message your girlfriend..."
            autocomplete="off"
        >

        <button id="sendBtn">➤</button>

    </div>

    <div class="footer">
        Rashmika Mandanna girlfriend 
        <br>
        <button class="clear-btn" id="clearBtn">
            Clear conversation ↻
        </button>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
